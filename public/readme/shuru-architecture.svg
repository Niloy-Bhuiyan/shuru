<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Shuru architecture — from sign-in to payment</title>
  <desc id="dsc">A four-lane flow. Lane one: sign-in through Supabase Auth into the signup trigger, which reads a role invite and assigns student, employer or admin. Lane two: the three separate workspaces those roles land in. Lane three: the Pro checkout and its two settlement paths — a sandbox hosted checkout confirmed by a signed webhook, and Bangladeshi mobile money verified by an administrator — both converging on one grant function that writes the subscriptions table. Lane four: the Pro-gated retrieval service, a Python FastAPI process running a LangGraph state machine over pgvector, indexed with a LangChain splitter. Underneath everything, Postgres row level security is the trust boundary.</desc>

  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eyebrow { fill: #7D91B0; font-size: 11.5px; font-weight: 700; letter-spacing: 2.2px; }
    .h1      { fill: #E9EEF6; font-size: 30px;   font-weight: 700; letter-spacing: -0.5px; }
    .sub     { fill: #8FA3BF; font-size: 14px; }
    .lane    { fill: #64789A; font-size: 11px;   font-weight: 700; letter-spacing: 2.4px; }
    .t       { fill: #E9EEF6; font-size: 14.5px; font-weight: 650; }
    .s       { fill: #8FA3BF; font-size: 12.5px; }
    .mono    { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: 12px; fill: #9FB3CE; }
    .pill    { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: 11.5px; fill: #C7D5E8; }
    .edge    { fill: none; stroke: #33455F; stroke-width: 1.5; }
    .note    { fill: #64789A; font-size: 11.5px; font-style: italic; }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33455F"/>
    </marker>
    <marker id="ar-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34D399"/>
    </marker>
  </defs>

  <rect width="1400" height="940" fill="#0B1220"/>

  <!-- ══ header ══ -->
  <text x="60" y="54" class="eyebrow">NEXT.JS 16 · SUPABASE · POSTGRES RLS · PYTHON FASTAPI · LANGGRAPH · LANGCHAIN · PGVECTOR</text>
  <text x="60" y="92" class="h1">From sign-in to payment</text>
  <text x="60" y="118" class="sub">One path, four stages. Every arrow crosses a boundary that is enforced in the database, not only in the code that draws it.</text>

  <!-- ══ LANE 1 — identity ══ -->
  <text x="60" y="170" class="lane">01 · WHO YOU ARE</text>

  <rect x="60"  y="186" width="250" height="72" rx="10" fill="#101A2B" stroke="#24334D"/>
  <text x="80"  y="216" class="t">Sign in / Register</text>
  <text x="80"  y="238" class="s">Email + password, Google, GitHub</text>

  <path d="M318,222 L342,222" class="edge" marker-end="url(#ar)"/>

  <rect x="350" y="186" width="250" height="72" rx="10" fill="#101A2B" stroke="#24334D"/>
  <text x="370" y="216" class="t">Supabase Auth</text>
  <text x="370" y="238" class="s">Session cookie, email verified</text>

  <path d="M608,222 L632,222" class="edge" marker-end="url(#ar)"/>

  <rect x="640" y="186" width="300" height="72" rx="10" fill="#101A2B" stroke="#24334D"/>
  <text x="660" y="212" class="mono">handle_new_user()</text>
  <text x="660" y="238" class="s">Claims a role invite, or defaults to student</text>

  <path d="M948,222 L972,222" class="edge" marker-end="url(#ar)"/>

  <rect x="980" y="186" width="360" height="72" rx="10" fill="#101A2B" stroke="#FB923C" stroke-opacity="0.45"/>
  <text x="1000" y="212" class="t">One role, decided once</text>
  <text x="1000" y="236" class="pill">student · employer · admin</text>

  <!-- ══ LANE 2 — workspaces ══ -->
  <text x="60" y="316" class="lane">02 · WHERE THAT ROLE LANDS YOU</text>
  <text x="332" y="316" class="note">— three separate products. No screen offers a door into another one.</text>

  <rect x="60"  y="332" width="406" height="112" rx="10" fill="#101A2B" stroke="#24334D"/>
  <text x="80"  y="360" class="t">Student app</text>
  <text x="80"  y="382" class="mono">(main)</text>
  <text x="80"  y="406" class="s">Radar, Reality Check, Resume Forge,</text>
  <text x="80"  y="426" class="s">application vault — all free, all computed</text>

  <rect x="497" y="332" width="406" height="112" rx="10" fill="#101A2B" stroke="#24334D"/>
  <text x="517" y="360" class="t">Employer console</text>
  <text x="517" y="382" class="mono">(operator)/employer</text>
  <text x="517" y="406" class="s">Post listings, review applicants,</text>
  <text x="517" y="426" class="s">move the pipeline, promote a listing</text>

  <rect x="934" y="332" width="406" height="112" rx="10" fill="#101A2B" stroke="#34D399" stroke-opacity="0.4"/>
  <text x="954" y="360" class="t">Admin console</text>
  <text x="954" y="382" class="mono">(operator)/admin</text>
  <text x="954" y="406" class="s">Moderation, employer access, referrals,</text>
  <text x="954" y="426" class="s">and transaction verification</text>

  <!-- admin -> review, drawn down the right edge and back into lane 3.
       The elbow sits BELOW its own label; routing it through the label is
       what the first draft did, and the text became unreadable. -->
  <path d="M1137,444 L1137,566 L933,566 L933,584" class="edge" stroke="#34D399" stroke-opacity="0.55" marker-end="url(#ar-mint)"/>
  <text x="950" y="548" class="note" fill="#34D399" fill-opacity="0.85">an admin decides these</text>

  <!-- ══ LANE 3 — money ══ -->
  <text x="60" y="512" class="lane">03 · PAYING FOR PRO</text>
  <text x="245" y="512" class="note">— price and duration are read server-side; the request body only says which plan and which method.</text>

  <rect x="60" y="528" width="180" height="150" rx="10" fill="#101A2B" stroke="#FB923C" stroke-opacity="0.45"/>
  <text x="80" y="558" class="t">/pro</text>
  <text x="80" y="582" class="s">Monthly or</text>
  <text x="80" y="600" class="s">yearly, in BDT</text>
  <text x="80" y="632" class="s">Unlocks the</text>
  <text x="80" y="650" class="s">three AI features</text>
  <text x="80" y="668" class="s">only</text>

  <path d="M248,570 L272,570" class="edge" marker-end="url(#ar)"/>
  <path d="M248,640 L272,640" class="edge" marker-end="url(#ar)"/>

  <!-- automatic path -->
  <rect x="280" y="528" width="470" height="84" rx="10" fill="#101A2B" stroke="#24334D"/>
  <text x="300" y="556" class="t">Card · Demo</text>
  <text x="300" y="578" class="s">Hosted sandbox checkout, then an HMAC-signed</text>
  <text x="300" y="598" class="s">webhook with an idempotency key. No card is collected.</text>

  <!-- manual path -->
  <rect x="280" y="626" width="470" height="84" rx="10" fill="#101A2B" stroke="#24334D"/>
  <text x="300" y="654" class="t">bKash · Nagad · Rocket</text>
  <text x="300" y="676" class="s">The payer sends from their own wallet app and submits</text>
  <text x="300" y="696" class="s">the transaction ID. An admin verifies it. No PIN, ever.</text>

  <!-- Both settlement paths merge onto ONE line before entering the grant.
       Drawn this way rather than as two arrows meeting in mid-air, because
       the single shared arrow is the claim the diagram is making: whichever
       way the money arrived, the same function decides what it bought. -->
  <path d="M758,668 L790,668 L790,634" class="edge"/>
  <path d="M758,570 L790,570 L790,634 L800,634" class="edge" marker-end="url(#ar)"/>

  <rect x="808" y="592" width="250" height="84" rx="10" fill="#101A2B" stroke="#34D399" stroke-opacity="0.4"/>
  <text x="828" y="620" class="mono">grantEntitlement()</text>
  <text x="828" y="644" class="s">One function, both paths.</text>
  <text x="828" y="664" class="s">Reads the stored row only.</text>

  <path d="M1066,634 L1096,634" class="edge" marker-end="url(#ar)"/>

  <rect x="1104" y="592" width="236" height="84" rx="10" fill="#101A2B" stroke="#24334D"/>
  <text x="1124" y="620" class="mono">subscriptions</text>
  <text x="1124" y="644" class="s">Service role writes only —</text>
  <text x="1124" y="664" class="s">no policy grants anyone else.</text>

  <!-- ══ LANE 4 — retrieval ══ -->
  <text x="60" y="742" class="lane">04 · THE RETRIEVAL SERVICE — A PRO FEATURE</text>

  <rect x="60" y="758" width="1280" height="104" rx="10" fill="#0E1729" stroke="#818CF8" stroke-opacity="0.35"/>

  <text x="80"  y="786" class="mono">POST /api/ask</text>
  <path d="M188,782 L212,782" class="edge" marker-end="url(#ar)"/>
  <text x="222" y="786" class="t">Python · FastAPI</text>
  <text x="352" y="786" class="s">— its own deployable unit, its own test suite, its own failure mode</text>

  <text x="80" y="814" class="s">LangGraph <tspan class="mono">StateGraph</tspan></text>

  <rect x="222" y="800" width="112" height="24" rx="6" fill="#151F35" stroke="#2C3C57"/>
  <text x="236" y="817" class="pill">embed</text>
  <rect x="344" y="800" width="112" height="24" rx="6" fill="#151F35" stroke="#2C3C57"/>
  <text x="358" y="817" class="pill">retrieve</text>
  <rect x="466" y="800" width="112" height="24" rx="6" fill="#151F35" stroke="#2C3C57"/>
  <text x="480" y="817" class="pill">grade</text>
  <rect x="588" y="800" width="112" height="24" rx="6" fill="#151F35" stroke="#2C3C57"/>
  <text x="602" y="817" class="pill">generate</text>
  <rect x="710" y="800" width="168" height="24" rx="6" fill="#151F35" stroke="#818CF8" stroke-opacity="0.55"/>
  <text x="724" y="817" class="pill" fill="#C3CBFA">verify_grounding</text>
  <rect x="888" y="800" width="112" height="24" rx="6" fill="#151F35" stroke="#2C3C57"/>
  <text x="902" y="817" class="pill">abstain</text>

  <path d="M334,812 L342,812" class="edge"/>
  <path d="M456,812 L464,812" class="edge"/>
  <path d="M578,812 L586,812" class="edge"/>
  <path d="M700,812 L708,812" class="edge"/>
  <path d="M878,812 L886,812" class="edge"/>

  <text x="1020" y="795" class="s">Three of six nodes can end the run</text>
  <text x="1020" y="817" class="s">with no answer at all.</text>

  <text x="80" y="848" class="s">Indexed with LangChain <tspan class="mono">RecursiveCharacterTextSplitter</tspan> into <tspan class="mono">pgvector</tspan> (HNSW, cosine) — the same Postgres, no new infrastructure.</text>

  <!-- ══ the boundary under all of it ══ -->
  <rect x="60" y="882" width="1280" height="40" rx="8" fill="#101A2B" stroke="#FB923C" stroke-opacity="0.35"/>
  <text x="80" y="907" class="t" fill="#FDBA74">Postgres Row Level Security — the trust boundary</text>
  <text x="500" y="907" class="s">Middleware redirects and role checks are convenience. A direct API call bypasses both; it does not bypass this.</text>
</svg>
