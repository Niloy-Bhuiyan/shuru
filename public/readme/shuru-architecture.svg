<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190" role="img" aria-labelledby="title desc">
  <title id="title">Shuru reference architecture</title>
  <desc id="desc">Architecture diagram: public clients and three role workspaces; the Next.js 16 runtime with its request boundary, route handlers and deterministic domain services; a separate Python FastAPI retrieval service running a LangGraph state machine over pgvector; the Supabase project as the authorization boundary; and optional external integrations.</desc>

  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .h1 { fill: #e7eef8; font-size: 30px; font-weight: 800; letter-spacing: -0.3px; }
    .eyebrow { fill: #91a4bd; font-size: 12px; font-weight: 700; letter-spacing: 2.2px; }
    .band { fill: #91a4bd; font-size: 12px; font-weight: 800; letter-spacing: 2.4px; }
    .card-t { fill: #e7eef8; font-size: 15px; font-weight: 700; }
    .card-s { fill: #91a4bd; font-size: 12.5px; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #91a4bd; }
    .tag { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; }
    .node-t { fill: #e7eef8; font-size: 12.5px; font-weight: 700; }
    .flow { stroke-width: 2; fill: none; }
    .rule { fill: #7bdc9a; font-size: 12.5px; font-weight: 700; }
  </style>

  <defs>
    <marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#45d4d0"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7aa2f7"/>
    </marker>
    <marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b48ef7"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <rect width="1600" height="1190" fill="#09111f"/>

  <!-- header -->
  <text x="56" y="58" class="eyebrow">NEXT.JS 16 · SUPABASE · PYTHON / FASTAPI · LANGGRAPH · LANGCHAIN · PGVECTOR · VERCEL</text>
  <text x="56" y="94" class="h1">Shuru reference architecture</text>
  <text x="56" y="120" class="card-s">Two deployable units. Postgres Row Level Security is the authorization boundary — everything above it is convenience.</text>

  <g transform="translate(1080,40)">
    <line x1="0" y1="10" x2="26" y2="10" stroke="#45d4d0" class="flow" marker-end="url(#a-cyan)"/>
    <text x="34" y="14" class="mono">user request</text>
    <line x1="0" y1="34" x2="26" y2="34" stroke="#7aa2f7" class="flow" marker-end="url(#a-blue)"/>
    <text x="34" y="38" class="mono">RLS-scoped data</text>
    <line x1="230" y1="10" x2="256" y2="10" stroke="#b48ef7" class="flow" marker-end="url(#a-violet)"/>
    <text x="264" y="14" class="mono">retrieval</text>
    <line x1="230" y1="34" x2="256" y2="34" stroke="#f7768e" class="flow" marker-end="url(#a-red)"/>
    <text x="264" y="38" class="mono">abstain / privileged</text>
  </g>

  <!-- band 1 -->
  <text x="56" y="170" class="band">PUBLIC CLIENT</text>
  <rect x="56" y="184" width="1488" height="128" rx="14" fill="#101c2e" stroke="#2b405d"/>
  <g transform="translate(80,206)">
    <rect width="330" height="86" rx="10" fill="#142238" stroke="#2b405d"/>
    <text x="18" y="28" class="card-t">Student app</text>
    <text x="18" y="49" class="card-s">Radar · Saved · Forge · Vault · You</text>
    <text x="18" y="70" class="mono">src/app/(main)</text>
  </g>
  <g transform="translate(430,206)">
    <rect width="330" height="86" rx="10" fill="#142238" stroke="#2b405d"/>
    <text x="18" y="28" class="card-t">Operator workspace</text>
    <text x="18" y="49" class="card-s">Employer pipeline · Admin moderation</text>
    <text x="18" y="70" class="mono">src/app/(operator)</text>
  </g>
  <g transform="translate(780,206)">
    <rect width="330" height="86" rx="10" fill="#142238" stroke="#2b405d"/>
    <text x="18" y="28" class="card-t">Agent dock</text>
    <text x="18" y="49" class="card-s">Corner chat on every signed-in screen</text>
    <text x="18" y="70" class="mono">SSE · hides with no provider key</text>
  </g>
  <g transform="translate(1130,206)">
    <rect width="390" height="86" rx="10" fill="#142238" stroke="#2b405d"/>
    <text x="18" y="28" class="card-t">Trust assumption</text>
    <text x="18" y="49" class="card-s">The client is never trusted. Hiding a link</text>
    <text x="18" y="70" class="card-s">is an affordance, never a control.</text>
  </g>

  <line x1="800" y1="312" x2="800" y2="352" stroke="#45d4d0" class="flow" marker-end="url(#a-cyan)"/>

  <!-- band 2 -->
  <text x="56" y="378" class="band">NEXT.JS 16 RUNTIME · VERCEL</text>
  <rect x="56" y="392" width="1488" height="282" rx="14" fill="#101c2e" stroke="#2b405d"/>

  <g transform="translate(80,414)">
    <rect width="440" height="108" rx="10" fill="#18293f" stroke="#45d4d0" stroke-opacity="0.5"/>
    <text x="18" y="26" class="tag" fill="#45d4d0">REQUEST BOUNDARY</text>
    <text x="18" y="50" class="card-t">src/middleware.ts</text>
    <text x="18" y="71" class="card-s">Session refresh · role gate · CSP per request</text>
    <text x="18" y="91" class="mono">student / employer / admin route sets</text>
  </g>
  <g transform="translate(540,414)">
    <rect width="440" height="108" rx="10" fill="#142238" stroke="#2b405d"/>
    <text x="18" y="26" class="tag" fill="#91a4bd">ROUTE HANDLERS</text>
    <text x="18" y="50" class="card-t">src/app/api/*</text>
    <text x="18" y="71" class="card-s">agent · ask · ingest · cron · payments</text>
    <text x="18" y="91" class="mono">timing-safe shared-secret compare</text>
  </g>
  <g transform="translate(1000,414)">
    <rect width="520" height="108" rx="10" fill="#142238" stroke="#2b405d"/>
    <text x="18" y="26" class="tag" fill="#91a4bd">DATA ACCESS</text>
    <text x="18" y="50" class="card-t">src/lib/data/*</text>
    <text x="18" y="71" class="card-s">One module per domain, client-side, RLS-scoped</text>
    <text x="18" y="91" class="mono">the service-role key never reaches the browser</text>
  </g>

  <g transform="translate(80,542)">
    <rect width="900" height="112" rx="10" fill="#18293f" stroke="#7bdc9a" stroke-opacity="0.45"/>
    <text x="18" y="26" class="tag" fill="#7bdc9a">DETERMINISTIC DOMAIN SERVICES — NO MODEL DECIDES ELIGIBILITY</text>
    <text x="18" y="52" class="card-t">Matching · Eligibility · Reality Check · ATS scoring · ingest normalise + dedupe</text>
    <text x="18" y="74" class="card-s">Pure, unit-tested functions. Below MIN_COVERAGE the engine returns null instead of a number.</text>
    <text x="18" y="98" class="rule">SCORE OR ABSTAIN — ADR 0002</text>
  </g>
  <g transform="translate(1000,542)">
    <rect width="520" height="112" rx="10" fill="#142238" stroke="#b48ef7" stroke-opacity="0.5"/>
    <text x="18" y="26" class="tag" fill="#b48ef7">RETRIEVAL CLIENT</text>
    <text x="18" y="50" class="card-t">src/lib/rag/client.ts · server-only</text>
    <text x="18" y="71" class="card-s">User id comes from the session, never the body</text>
    <text x="18" y="93" class="mono">service absent → /api/ask says unavailable</text>
  </g>

  <path d="M1260 654 L1260 706" stroke="#b48ef7" class="flow" marker-end="url(#a-violet)"/>
  <path d="M300 654 L300 962" stroke="#7aa2f7" class="flow" marker-end="url(#a-blue)"/>

  <!-- band 3 -->
  <text x="880" y="732" class="band">PYTHON RETRIEVAL SERVICE · services/rag · SEPARATE DEPLOYABLE</text>
  <rect x="880" y="746" width="664" height="180" rx="14" fill="#101c2e" stroke="#b48ef7" stroke-opacity="0.45"/>
  <text x="902" y="774" class="card-t">FastAPI · LangGraph StateGraph · LangChain splitter · fastembed ONNX</text>

  <g transform="translate(902,788)">
    <rect width="100" height="32" rx="8" fill="#18293f" stroke="#2b405d"/>
    <text x="50" y="21" class="node-t" text-anchor="middle">retrieve</text>
    <line x1="100" y1="16" x2="124" y2="16" stroke="#b48ef7" class="flow" marker-end="url(#a-violet)"/>

    <rect x="124" width="100" height="32" rx="8" fill="#18293f" stroke="#2b405d"/>
    <text x="174" y="21" class="node-t" text-anchor="middle">grade</text>
    <line x1="224" y1="16" x2="248" y2="16" stroke="#b48ef7" class="flow" marker-end="url(#a-violet)"/>

    <rect x="248" width="100" height="32" rx="8" fill="#18293f" stroke="#2b405d"/>
    <text x="298" y="21" class="node-t" text-anchor="middle">generate</text>
    <line x1="348" y1="16" x2="372" y2="16" stroke="#b48ef7" class="flow" marker-end="url(#a-violet)"/>

    <rect x="372" width="146" height="32" rx="8" fill="#18293f" stroke="#f7768e" stroke-opacity="0.6"/>
    <text x="445" y="21" class="node-t" text-anchor="middle">verify_grounding</text>

    <path d="M174 32 L174 54 L286 54" stroke="#f7768e" class="flow" marker-end="url(#a-red)"/>
    <path d="M445 32 L445 54 L354 54" stroke="#f7768e" class="flow" marker-end="url(#a-red)"/>
    <text x="320" y="76" class="tag" fill="#f7768e" text-anchor="middle">ABSTAIN</text>
  </g>

  <text x="902" y="896" class="card-s">Three abstain exits and one self-rejection: a draft that cites nothing, or cites a passage that was never</text>
  <text x="902" y="913" class="card-s">retrieved, is discarded rather than returned. Threshold 0.46 — measured, not the shipped default of 0.75.</text>

  <path d="M1212 926 L1212 962" stroke="#b48ef7" class="flow" marker-end="url(#a-violet)"/>

  <!-- band 4 -->
  <text x="56" y="962" class="band">SUPABASE PROJECT · AUTHORIZATION BOUNDARY</text>
  <rect x="56" y="976" width="1488" height="140" rx="14" fill="#101c2e" stroke="#f7768e" stroke-opacity="0.45"/>

  <g transform="translate(80,996)">
    <rect width="360" height="100" rx="10" fill="#142238" stroke="#2b405d"/>
    <text x="18" y="26" class="card-t">Postgres · Row Level Security</text>
    <text x="18" y="47" class="card-s">RLS on every table. Policies are the fine</text>
    <text x="18" y="65" class="card-s">gate, grants the coarse one; both required.</text>
    <text x="18" y="87" class="mono">test:rls asserts SQLSTATE 42501</text>
  </g>
  <g transform="translate(460,996)">
    <rect width="360" height="100" rx="10" fill="#142238" stroke="#2b405d"/>
    <text x="18" y="26" class="card-t">Guard triggers · role model</text>
    <text x="18" y="47" class="card-s">No self-write path to user_roles. Employer</text>
    <text x="18" y="65" class="card-s">access is request → approve; invites are</text>
    <text x="18" y="87" class="card-s">email-keyed, so no escalation RPC exists.</text>
  </g>
  <g transform="translate(840,996)">
    <rect width="330" height="100" rx="10" fill="#142238" stroke="#b48ef7" stroke-opacity="0.5"/>
    <text x="18" y="26" class="card-t">pgvector · rag_chunks</text>
    <text x="18" y="47" class="card-s">HNSW + cosine, same database —</text>
    <text x="18" y="65" class="card-s">no new infrastructure. No write policy</text>
    <text x="18" y="87" class="card-s">at all, so no user can inject text.</text>
  </g>
  <g transform="translate(1190,996)">
    <rect width="330" height="100" rx="10" fill="#142238" stroke="#2b405d"/>
    <text x="18" y="26" class="card-t">Auth · Storage</text>
    <text x="18" y="47" class="card-s">Email + OAuth, SSR cookie sessions.</text>
    <text x="18" y="65" class="card-s">handle_new_user sets the starting role</text>
    <text x="18" y="87" class="card-s">and consumes any open invite.</text>
  </g>

  <!-- band 5 -->
  <text x="56" y="1158" class="band">EXTERNAL — ALL OPTIONAL · A MISSING KEY HIDES THE FEATURE, IT NEVER FAKES OUTPUT</text>
  <g class="mono">
    <text x="700" y="1158">Anthropic / Gemini</text>
    <text x="860" y="1158">Lever · Ashby · Arbeitnow · Adzuna</text>
    <text x="1130" y="1158">Resend / Postmark</text>
    <text x="1280" y="1158">Web Push</text>
    <text x="1390" y="1158">Sandbox payments</text>
  </g>
</svg>
