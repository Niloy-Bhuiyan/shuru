<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Shuru platform architecture</title>
  <desc id="desc">Animated pixel-style diagram showing users flowing through the Next.js application to Supabase and optional external services.</desc>

  <style>
    :root {
      --cream: #f4e9d8;
      --paper: #fbf4e6;
      --ink: #1b2a3a;
      --amber: #ff7a3c;
      --mint: #3fbfa0;
      --grey: #8a8578;
      --alert: #e5533d;
    }

    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { fill: var(--grey); font-size: 14px; font-weight: 800; letter-spacing: 3px; }
    .node-title { fill: var(--ink); font-size: 17px; font-weight: 900; letter-spacing: 1px; }
    .node-copy { fill: var(--grey); font-size: 12px; font-weight: 700; }
    .wire { fill: none; stroke: var(--ink); stroke-width: 5; }
    .wire-live { fill: none; stroke: var(--mint); stroke-width: 4; stroke-dasharray: 12 12; animation: flow 1.4s linear infinite; }
    .wire-optional { fill: none; stroke: var(--amber); stroke-width: 4; stroke-dasharray: 8 12; animation: flow 1.8s linear infinite reverse; }
    .status { animation: pulse 1.8s steps(2, end) infinite; }
    .status-late { animation: pulse 1.8s steps(2, end) .6s infinite; }
    .packet { animation: packet-blink .7s steps(2, end) infinite; }
    .panel-in { animation: panel-in .7s steps(4, end) both; }
    .delay-1 { animation-delay: .15s; }
    .delay-2 { animation-delay: .30s; }
    .delay-3 { animation-delay: .45s; }
    .scan { animation: scan 7s linear infinite; }

    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes pulse {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: .34; }
    }
    @keyframes packet-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: .55; }
    }
    @keyframes panel-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scan {
      from { transform: translateY(-720px); }
      to { transform: translateY(720px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .panel-in { opacity: 1; transform: none; }
      .packet { display: none; }
    }
  </style>

  <defs>
    <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="var(--amber)" opacity=".10"/>
      <rect x="4" y="4" width="4" height="4" fill="var(--amber)" opacity=".10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="var(--ink)"/>
    </marker>
    <clipPath id="frame-cut">
      <path d="M16 0H1184V8H1192V16H1200V704H1192V712H1184V720H16V712H8V704H0V16H8V8H16Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame-cut)">
    <rect width="1200" height="720" fill="var(--cream)"/>
    <rect width="1200" height="720" fill="url(#dither)"/>

    <text x="56" y="58" fill="var(--ink)" font-size="28" font-weight="900" letter-spacing="3">SHURU / SYSTEM MAP</text>
    <text x="56" y="86" class="label">HONEST DATA IN · EXPLAINABLE DECISIONS OUT</text>
    <rect x="1058" y="46" width="14" height="14" fill="var(--mint)" class="status"/>
    <text x="1082" y="59" class="node-copy">LIVE</text>

    <!-- Actors -->
    <text x="56" y="132" class="label">01 / ACTORS</text>
    <g class="panel-in">
      <path d="M56 150H316V158H324V220H316V228H56V220H48V158H56Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="4"/>
      <rect x="70" y="170" width="28" height="28" fill="var(--amber)"/>
      <rect x="78" y="162" width="12" height="12" fill="var(--ink)"/>
      <text x="116" y="183" class="node-title">STUDENT</text>
      <text x="116" y="204" class="node-copy">discover · apply · track</text>
    </g>
    <g class="panel-in delay-1">
      <path d="M470 150H730V158H738V220H730V228H470V220H462V158H470Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="4"/>
      <rect x="484" y="170" width="28" height="28" fill="var(--mint)"/>
      <path d="M488 168h20v-8h-20z" fill="var(--ink)"/>
      <text x="530" y="183" class="node-title">EMPLOYER</text>
      <text x="530" y="204" class="node-copy">post · review · hire</text>
    </g>
    <g class="panel-in delay-2">
      <path d="M884 150H1144V158H1152V220H1144V228H884V220H876V158H884Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="4"/>
      <rect x="898" y="170" width="28" height="28" fill="var(--alert)"/>
      <path d="M902 174h20v20h-20z" fill="none" stroke="var(--ink)" stroke-width="4"/>
      <text x="944" y="183" class="node-title">ADMIN</text>
      <text x="944" y="204" class="node-copy">verify · moderate · audit</text>
    </g>

    <!-- Actor connections -->
    <path d="M186 228V258H600" class="wire"/>
    <path d="M600 228V274" class="wire" marker-end="url(#arrow)"/>
    <path d="M1014 228V258H600" class="wire"/>
    <path d="M186 228V258H600" class="wire-live"/>
    <path d="M600 228V274" class="wire-live"/>
    <path d="M1014 228V258H600" class="wire-live"/>

    <!-- Next.js -->
    <g class="panel-in delay-1">
      <text x="56" y="286" class="label">02 / NEXT.JS APPLICATION</text>
      <path d="M56 302H1144V310H1152V462H1144V470H56V462H48V310H56Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="5"/>
      <rect x="48" y="302" width="1104" height="16" fill="var(--amber)"/>

      <g>
        <path d="M86 346H306V354H314V422H306V430H86V422H78V354H86Z" fill="var(--cream)" stroke="var(--ink)" stroke-width="4"/>
        <text x="104" y="377" class="node-title">APP SURFACES</text>
        <text x="104" y="400" class="node-copy">App Router · responsive UI</text>
        <rect x="104" y="411" width="68" height="5" fill="var(--mint)"/>
      </g>

      <g>
        <path d="M356 346H576V354H584V422H576V430H356V422H348V354H356Z" fill="var(--cream)" stroke="var(--ink)" stroke-width="4"/>
        <text x="374" y="377" class="node-title">MIDDLEWARE</text>
        <text x="374" y="400" class="node-copy">session · role routing</text>
        <rect x="374" y="411" width="68" height="5" fill="var(--amber)"/>
      </g>

      <g>
        <path d="M626 346H846V354H854V422H846V430H626V422H618V354H626Z" fill="var(--cream)" stroke="var(--ink)" stroke-width="4"/>
        <text x="644" y="377" class="node-title">ROUTE HANDLERS</text>
        <text x="644" y="400" class="node-copy">API · cron · server actions</text>
        <rect x="644" y="411" width="68" height="5" fill="var(--mint)"/>
      </g>

      <g>
        <path d="M896 346H1116V354H1124V422H1116V430H896V422H888V354H896Z" fill="var(--cream)" stroke="var(--ink)" stroke-width="4"/>
        <text x="914" y="377" class="node-title">DOMAIN ENGINES</text>
        <text x="914" y="400" class="node-copy">match · ATS · eligibility</text>
        <rect x="914" y="411" width="68" height="5" fill="var(--amber)"/>
      </g>

      <path d="M314 388H340" class="wire" marker-end="url(#arrow)"/>
      <path d="M584 388H610" class="wire" marker-end="url(#arrow)"/>
      <path d="M854 388H880" class="wire" marker-end="url(#arrow)"/>
      <path d="M314 388H340M584 388H610M854 388H880" class="wire-live"/>
    </g>

    <!-- Lower connections -->
    <path d="M458 430V494H258V530" class="wire" marker-end="url(#arrow)"/>
    <path d="M736 430V494H510V530" class="wire" marker-end="url(#arrow)"/>
    <path d="M1006 430V494H950V530" class="wire" marker-end="url(#arrow)"/>
    <path d="M458 430V494H258V530M736 430V494H510V530" class="wire-live"/>
    <path d="M1006 430V494H950V530" class="wire-optional"/>

    <!-- Supabase -->
    <g class="panel-in delay-2">
      <text x="56" y="530" class="label">03 / SUPABASE · TRUST BOUNDARY</text>
      <path d="M56 548H748V556H756V664H748V672H56V664H48V556H56Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="5"/>
      <rect x="48" y="548" width="708" height="14" fill="var(--mint)"/>

      <path d="M82 586H244V594H252V640H244V648H82V640H74V594H82Z" fill="var(--cream)" stroke="var(--ink)" stroke-width="4"/>
      <rect x="94" y="602" width="12" height="12" fill="var(--mint)" class="status"/>
      <text x="118" y="613" class="node-title">AUTH</text>
      <text x="94" y="633" class="node-copy">identity + sessions</text>

      <path d="M286 586H496V594H504V640H496V648H286V640H278V594H286Z" fill="var(--cream)" stroke="var(--ink)" stroke-width="4"/>
      <rect x="298" y="602" width="12" height="12" fill="var(--mint)" class="status-late"/>
      <text x="322" y="613" class="node-title">POSTGRES + RLS</text>
      <text x="298" y="633" class="node-copy">final authorization layer</text>

      <path d="M538 586H714V594H722V640H714V648H538V640H530V594H538Z" fill="var(--cream)" stroke="var(--ink)" stroke-width="4"/>
      <rect x="550" y="602" width="12" height="12" fill="var(--mint)" class="status"/>
      <text x="574" y="613" class="node-title">STORAGE</text>
      <text x="550" y="633" class="node-copy">private CV files</text>
    </g>

    <!-- External services -->
    <g class="panel-in delay-3">
      <text x="804" y="530" class="label">04 / OPTIONAL SERVICES</text>
      <path d="M804 548H1144V556H1152V664H1144V672H804V664H796V556H804Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="5" stroke-dasharray="14 8"/>

      <rect x="824" y="580" width="14" height="14" fill="var(--amber)" class="status"/>
      <text x="850" y="592" class="node-title">JOB SOURCES</text>
      <text x="1036" y="592" class="node-copy">ingest</text>

      <rect x="824" y="610" width="14" height="14" fill="var(--amber)" class="status-late"/>
      <text x="850" y="622" class="node-title">GEMINI</text>
      <text x="1036" y="622" class="node-copy">assist</text>

      <rect x="824" y="640" width="14" height="14" fill="var(--amber)" class="status"/>
      <text x="850" y="652" class="node-title">EMAIL + PUSH</text>
      <text x="1036" y="652" class="node-copy">deliver</text>
    </g>

    <!-- Animated request packets -->
    <rect class="packet" width="10" height="10" fill="var(--mint)">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M186 230 L186 258 L600 258 L600 274"/>
    </rect>
    <rect class="packet" width="10" height="10" fill="var(--amber)">
      <animateMotion dur="3.2s" begin=".8s" repeatCount="indefinite" path="M1014 230 L1014 258 L600 258 L600 274"/>
    </rect>
    <rect class="packet" width="10" height="10" fill="var(--mint)">
      <animateMotion dur="2.6s" begin=".4s" repeatCount="indefinite" path="M736 430 L736 494 L510 494 L510 530"/>
    </rect>
    <rect class="packet" width="10" height="10" fill="var(--amber)">
      <animateMotion dur="3s" begin="1.2s" repeatCount="indefinite" path="M1006 430 L1006 494 L950 494 L950 530"/>
    </rect>

    <rect class="scan" x="0" y="0" width="1200" height="3" fill="var(--ink)" opacity=".08"/>
  </g>

  <path d="M16 3H1184V11H1192V19H1197V701H1189V709H1181V717H19V709H11V701H3V19H11V11H16Z" fill="none" stroke="var(--ink)" stroke-width="6"/>
</svg>
